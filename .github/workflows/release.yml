name: Release

# Every push to main is considered for a release. `scripts/version.ts` looks at the commits since the
# last vX.Y.Z tag: changes to the program (src/, patches/, dependencies) release, docs/tests/CI don't.
#   feat: …                → minor      fix: … / anything else that ships → patch
#   feat!: … / BREAKING CHANGE / [major] → major      [skip release] in a message → not counted
# A release is the exact commit that was built and tested: all platforms are built, each binary is run on
# its own OS, then the GitHub release (tag + archives + checksums), the Homebrew formula, the Docker image
# and an install check follow. Run it by hand from the Actions tab to force a bump or to preview the plan.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commits since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only show what would be released
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# One release at a time, in push order. A newer push waits (and replaces any older waiting one),
# then computes its version from the tags the earlier release left behind.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  plan:
    name: plan the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      major_minor: ${{ steps.plan.outputs.major_minor }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: plan
        run: bun scripts/version.ts plan --sha "$GITHUB_SHA" --bump "${{ inputs.bump || 'auto' }}" --dry-run "${{ inputs.dry_run || 'false' }}"

  build:
    name: build all platforms
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The tag is the source of truth; the binary just needs to report it.
      - run: bun scripts/version.ts set "${{ needs.plan.outputs.version }}"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Bun cross-compiles, but every target's native OpenTUI package has to be installed.
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun scripts/package.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

  smoke:
    name: runs on ${{ matrix.target }}
    needs: [plan, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Unpack and run (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir bin && tar -xzf "release/patteo-${{ matrix.target }}.tar.gz" -C bin
          out="$(./bin/patteo --version)"
          echo "$out"
          test "$out" = "patteo ${{ needs.plan.outputs.version }}"
      - name: Unpack and run (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive release/patteo-windows-x64.zip -DestinationPath bin
          $out = (& ./bin/patteo.exe --version)
          Write-Host $out
          if ($out -ne "patteo ${{ needs.plan.outputs.version }}") { throw "unexpected version output: $out" }

  publish:
    name: publish the release
    needs: [plan, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: GitHub release (the tag lands on the commit that was built)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          # Idempotent: re-running a failed workflow must not trip over the release it already made.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ needs.plan.outputs.sha }}" \
              --title "patteo ${{ needs.plan.outputs.version }}" \
              --generate-notes
          fi
      - name: Record the release on main (package.json version + Homebrew formula)
        run: bun scripts/finalize-release.ts "${{ needs.plan.outputs.version }}" release/checksums.txt

  docker:
    name: docker image (ghcr.io)
    needs: [plan, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # The image is assembled from the binaries we already built and smoke-tested,
      # so nothing is compiled under emulation.
      - name: Stage the Linux binaries per architecture
        run: |
          for pair in amd64:x64 arm64:arm64; do
            arch="${pair%%:*}"; target="${pair##*:}"
            mkdir -p ".release-docker/$arch"
            tar -xzf "release/patteo-linux-$target.tar.gz" -C ".release-docker/$arch"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.major_minor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  verify-install:
    name: install script works (${{ matrix.os }})
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh --version "${{ needs.plan.outputs.version }}" --dir "$RUNNER_TEMP/bin"
          test "$("$RUNNER_TEMP/bin/patteo" --version)" = "patteo ${{ needs.plan.outputs.version }}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Version "${{ needs.plan.outputs.version }}" -InstallDir "$env:RUNNER_TEMP\bin"
          $out = (& "$env:RUNNER_TEMP\bin\patteo.exe" --version)
          if ($out -ne "patteo ${{ needs.plan.outputs.version }}") { throw "unexpected version output: $out" }
